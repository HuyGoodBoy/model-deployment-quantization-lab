plugins { id 'com.android.application' }

android {
    namespace 'com.vin.deploylab'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.vin.deploylab'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Development signing only: these APKs are for Test Lab, not publication.
            signingConfig signingConfigs.debug
        }
    }
    testBuildType 'release'
    // Internal benchmark APK: validation is compilation, package integrity and device tests.
    lint { checkReleaseBuilds false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'tflite', 'onnx', 'f32' }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'org.tensorflow:tensorflow-lite:2.15.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
